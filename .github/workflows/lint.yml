# Thin caller -> reusable lint in bendoerr-terraform-modules/workflows (SHA-pinned, big-blast).
# Go TOOL repo (not a TF module): tflint/trivy/terraform_docs gated OFF; golangci + common on.
# Its Go module is at the repo ROOT (go.mod), not test/ -> golangci_workdir empty (= action default root)
# + golangci_go_version_file go.mod, matching this repo's per-repo baseline. egress = reusable default.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      pull-requests: write
    uses: bendoerr-terraform-modules/workflows/.github/workflows/lint.yml@643fb6030f7d4300c4c43416ffef884aa6a3a426
    with:
      tflint: false
      trivy: false
      terraform_docs: false
      golangci_workdir: ""
      golangci_go_version_file: "go.mod"
