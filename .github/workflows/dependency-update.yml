name: "Update dependabot unsupported dependencies"

on:
  schedule:
    - cron: "5 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: "Pre-commit Dependency Update"
    runs-on: ubuntu-latest

    permissions:
      # contents: WRITE, not read. `create-pull-request` PUSHES a branch before it opens the PR,
      # (FIXED 2026-09-01 by #72 and still correct. It was NOT the whole cause: the job kept
      #  failing at the same step for a SECOND reason — see the token: comment below.)
      # and a push with a read-scoped GITHUB_TOKEN is a 403 -- the token's scope, not a repo or
      # org setting (both are `read` by default, which is correct hardening; the job block is
      # what grants what the job needs). This job granted `pull-requests: write` but left
      # `contents: read`, so it failed at the "Create new pull-request" step on EVERY weekly run
      # from at least 2026-02-23 through 2026-08-31 -- 28 consecutive failures, ~6 months, never
      # once green. Nothing surfaced it because dependabot sweeps look at PRs, and this job's
      # whole failure mode is that it never manages to open one.
      # The action's own README states the requirement verbatim:
      #     permissions: {contents: write, pull-requests: write}
      contents: write
      pull-requests: write

    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: "Update .pre-commit-config.yml"
        run: |
          pip install pre-commit
          pre-commit autoupdate --freeze

      - name: "Create new pull-request"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: always()
        with:
          # NOT the default GITHUB_TOKEN. The org setting "allow GitHub Actions to create and
          # approve pull requests" is OFF (org AND repo level, deliberately — that one toggle
          # also grants self-approval across every repo). With GITHUB_TOKEN this step fails
          # "GitHub Actions is not permitted to create or approve pull requests" on EVERY run.
          # A scoped PAT fixes just this job and leaves the org posture alone (Ben's call,
          # 2026-09-14). Needs: Contents read/write + Pull requests read/write, this repo only.
          token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}
          branch: update/pre-commit-hooks
          title: "⬆️ pch: Update pre-commit hook versions"
          commit-message: "⬆️ pch: Update pre-commit hook versions"
          labels: "dependencies,pre-commit"
